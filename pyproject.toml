[project]
name = "mypy-pytest-plugin"
requires-python = ">=3.12,<3.16"
authors = [{ name = "George Ogden" }]
license-files = ["LICENSE"]
readme = "README.md"
dynamic = ["version"]
dependencies = [
  "mypy==2.4.0",
  "pytest<9.2.0",
]

[dependency-groups]
dev = [
  "mirror-rorrim ; python_full_version >= '3.12'",
  "py-spy",
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "types" },
]
test = [
  "inline-snapshot",
  "platformdirs>=4.12.0",
  "pytest>=9.0.0",
  "pytest-dbg ; python_full_version >= '3.11'",
  "pytest-shard",
  "pytest-timeout",
  "pytest-xdist",
  { include-group = "utils" },
]
lint = [
  "linter==2.1.3",
  "prek",
  "ruff==0.17.2",
  "semgrep==1.181.1",
]
types = [
  "mypy",
  { include-group = "test" },
]
utils = [
  "extra-type-helpers ; python_full_version >= '3.12'",
  "georges-utils ; python_full_version >= '3.12'",
]
docs = [
  "mkdocs<2",
  "mkdocs-material",
  "mkdocstrings",
]

[tool.uv.sources]
extra-type-helpers = { git = "https://github.com/George-Ogden/extra-types" }
georges-utils = { git = "https://github.com/George-Ogden/utils" }
linter = { git = "https://github.com/George-Ogden/linter/" }
mirror-rorrim = { git = "https://github.com/George-Ogden/mirror-rorrim" }
pytest-dbg = { git = "https://github.com/George-Ogden/pytest-dbg" }

[tool.setuptools.dynamic]
version = { file = ["version.txt"] }

[tool.setuptools.package-dir]
"mypy_pytest_plugin" = "mypy_pytest_plugin"
"mypy_pytest_plugin_types-stubs" = "mypy_pytest_plugin_types"

[tool.setuptools.package-data]
"mypy_pytest_plugin_types" = ["*.pyi", "py.typed"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
