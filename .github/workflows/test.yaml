name: Run Python Tests

on:
  push:
    branches:
      - m
  pull_request:
    branches:
      - m

jobs:
  unit_tests:
    strategy:
      matrix:
        shard: [0, 1, 2]
        total-shards: [3]
    uses: George-Ogden/actions/.github/workflows/python-test.yaml@v5.1.2
    with:
      python-versions: "['3.12', '3.13', '3.14', '3.15']"
      timeout-minutes: 15
      pytest-flags: -vv mypy_pytest_plugin -n auto --shard-id=${{ matrix.shard }} --num-shards=${{ matrix.total-shards }} --inline-snapshot=disable

  integration_tests:
    uses: George-Ogden/actions/.github/workflows/python-test.yaml@v5.1.2
    with:
      python-versions: "['3.12', '3.13', '3.14', '3.15']"
      timeout-minutes: 10
      pytest-flags: -vv tests -n auto --inline-snapshot=disable
